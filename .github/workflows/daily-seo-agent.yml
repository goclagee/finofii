name: Daily SEO Agent

on:
  schedule:
    # 08:00 IST = 02:30 UTC
    - cron: '30 2 * * 1-5'  # Weekdays only
  workflow_dispatch:

jobs:
  generate-seo-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate SEO pages
        run: python3 seo_agent.py

      - name: Commit & push pages
        run: |
          git config user.name "SEO Agent"
          git config user.email "bot@finofii.com"
          git add frontend/src/pages/ frontend/src/App.js seo_agent.py
          git commit -m "Daily SEO: Generated pages $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push origin main
        env:
          GIT_AUTHOR_NAME: SEO Agent
          GIT_AUTHOR_EMAIL: bot@finofii.com
          GIT_COMMITTER_NAME: SEO Agent
          GIT_COMMITTER_EMAIL: bot@finofii.com

      - name: Submit to Google Search Console
        run: python3 gsc_submit.py
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_ID: ${{ secrets.GSC_SITE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        continue-on-error: true

      - name: Notify status
        run: |
          echo "✅ SEO Agent completed at $(date)"
          echo "   Generated: 23 pages"
          echo "   Deployed: Netlify (auto)"
          echo "   GSC: URLs submitted"
