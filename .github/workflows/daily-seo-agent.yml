name: Finofii Daily SEO Agent

on:
  schedule:
    - cron: '30 2 * * 1-5'
  workflow_dispatch:

jobs:
  generate-seo:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Configure git
        run: |
          git config user.email "seo-agent@finofii.com"
          git config user.name "Finofii SEO Agent"
          git config http.extraheader "Authorization: Basic $(echo -n x-access-token:${{ secrets.GITHUB_TOKEN }} | base64)"
      
      - name: Generate pages
        run: python3 seo_agent.py
      
      - name: Commit & push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Daily SEO batch — $(date +%Y-%m-%d) — pages generated"
            git push origin main
          else
            echo "No changes to commit"
          fi
